name: Docker Images CI Pipeline

on:
  push:
    branches: [trunk]
    paths:
      # Include
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-pipeline.yaml"

      # Exclude
      - "!**.md"
      - "!LICENSE"
      - "!circuits-information.csv"
      - "!README.md"
      - "!.gitignore"
      - "!docs/**"

jobs:
  call-docker-build:
    uses: Phylip28/gha-workflows/.github/workflows/docker-ghcr.yaml@trunk
    with:
      services: '["backend", "frontend"]'
    secrets: inherit
