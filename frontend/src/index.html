<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 2023 Live Telemetry Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Dashboard Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="f1-badge">F1</span>
                <h1>SEASON 2023</h1>
            </div>
            <div class="header-status">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="status-text">LIVE TELEMETRY FEED</span>
            </div>
            <button class="simulate-btn" id="simulateBtn" type="button">
                <span class="simulate-icon" aria-hidden="true">▶</span>
                <span>SIMULATE RACE</span>
            </button>
        </header>

        <div class="dashboard-grid">
            <!-- Left Panel: GP Schedule -->
            <aside class="panel circuits-panel">
                <div class="panel-header">
                    <h2>GRAND PRIX SCHEDULE</h2>
                </div>
                <div class="circuits-list" id="circuitsList">
                    <!-- Dynamic circuits list -->
                </div>
            </aside>

            <!-- Center Panel: Active Circuit Map & Telemetry -->
            <main class="panel telemetry-panel">
                <div class="active-circuit-header">
                    <div class="round-badge" id="activeRoundBadge">R01</div>
                    <div class="circuit-title-group">
                        <h2 id="circuitName">Sakhir</h2>
                        <span class="sub-label" id="circuitLocation">Bahrain</span>
                    </div>
                </div>
                
                <div class="circuit-visualizer">
                    <div class="nav-control-left" id="prevCircuit" role="button" tabindex="0" aria-label="Previous circuit">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </div>
                    
                    <div class="circuit-map" id="circuitImage">
                        <!-- SVG map -->
                    </div>

                    <div class="nav-control-right" id="nextCircuit" role="button" tabindex="0" aria-label="Next circuit">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </div>

                <div class="panel-sub-header">
                    <h3>WEATHER & TRACK TELEMETRY</h3>
                </div>
                <div class="weather-widget" id="weatherWidget">
                    <!-- Telemetry values -->
                </div>
            </main>

            <!-- Right Panel: Leaderboard Classification -->
            <aside class="panel leaderboard-panel">
                <div class="panel-header flex-header">
                    <h2>TIMING BOARD</h2>
                    <!-- Segmented tabs for session selection -->
                    <div class="session-tabs" id="sessionTabs">
                        <button class="session-tab active" data-filter="Race">RACE</button>
                        <button class="session-tab" data-filter="Qualifying">QUALY</button>
                        <button class="session-tab" data-filter="Practice">PRACTICE</button>
                    </div>
                </div>
                <div class="leaderboard-list" id="classificationList" aria-live="polite" aria-label="Driver classification">
                    <!-- Dynamic rows -->
                </div>
            </aside>
        </div>
    </div>

    <!-- Race Simulation Overlay -->
    <div class="simulation-overlay" id="simulationOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="simTitle">
        <div class="simulation-backdrop"></div>
        <div class="simulation-modal">
            <header class="simulation-header">
                <div class="simulation-title-group">
                    <span class="simulation-round" id="simRound">R01</span>
                    <h2 class="simulation-title" id="simTitle">Bahrain Grand Prix</h2>
                    <span class="simulation-subtitle" id="simSubtitle">Race Simulation</span>
                </div>
                <button class="simulation-close" id="simCloseBtn" type="button" aria-label="Close simulation">✕</button>
            </header>

            <main class="simulation-body">
                <section class="simulation-track" aria-label="Circuit simulation">
                    <div class="simulation-track-visual" id="simTrackVisual">
                        <canvas id="simTrackCanvas"></canvas>
                        <div class="simulation-dots" id="simDots"></div>
                    </div>
                    <div class="simulation-hud">
                        <div class="hud-item">
                            <span class="hud-label">LAP</span>
                            <span class="hud-value" id="simLap">1/57</span>
                        </div>
                        <div class="hud-item">
                            <span class="hud-label">TIME</span>
                            <span class="hud-value" id="simTime">14:01:00</span>
                        </div>
                        <div class="hud-item">
                            <span class="hud-label">LEADER</span>
                            <span class="hud-value" id="simLeader">VER</span>
                        </div>
                    </div>
                </section>

                <aside class="simulation-leaderboard" aria-label="Live positions">
                    <div class="sim-leaderboard-header">
                        <span>POS</span>
                        <span>DRIVER</span>
                        <span>TEAM</span>
                        <span>GAP</span>
                    </div>
                    <div class="sim-leaderboard-list" id="simLeaderboardList">
                        <!-- Populated by JS -->
                    </div>
                </aside>
            </main>

            <footer class="simulation-controls">
                <button class="control-btn" id="simPlayBtn" type="button" aria-label="Play simulation">
                    <span>▶</span>
                </button>
                <button class="control-btn" id="simPauseBtn" type="button" aria-label="Pause simulation">
                    <span>⏸</span>
                </button>
                <div class="speed-control">
                    <span class="speed-label">SPEED</span>
                    <div class="speed-options" id="simSpeedOptions">
                        <button class="speed-btn active" data-speed="1" type="button">1×</button>
                        <button class="speed-btn" data-speed="2" type="button">2×</button>
                        <button class="speed-btn" data-speed="5" type="button">5×</button>
                        <button class="speed-btn" data-speed="10" type="button">10×</button>
                    </div>
                </div>
                <div class="progress-control">
                    <span class="progress-time" id="simProgressTime">0%</span>
                    <div class="progress-track">
                        <div class="progress-fill" id="simProgressFill"></div>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
