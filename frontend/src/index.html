<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 2023 Live Telemetry Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Dashboard Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="f1-badge">F1</span>
                <h1>SEASON 2023</h1>
            </div>
            <div class="header-status">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="status-text">LIVE TELEMETRY FEED</span>
            </div>
            <button class="simulate-btn" id="simulateBtn" type="button">
                <span class="simulate-icon" aria-hidden="true">▶</span>
                <span>SIMULATE RACE</span>
            </button>
        </header>

        <div class="dashboard-grid">
            <!-- Left Panel: GP Schedule -->
            <aside class="panel circuits-panel">
                <div class="panel-header">
                    <h2>GRAND PRIX SCHEDULE</h2>
                </div>
                <div class="circuits-list" id="circuitsList">
                    <!-- Dynamic circuits list -->
                </div>
            </aside>

            <!-- Center Panel: Active Circuit Map & Telemetry -->
            <main class="panel telemetry-panel">
                <div class="active-circuit-header">
                    <div class="round-badge" id="activeRoundBadge">R01</div>
                    <div class="circuit-title-group">
                        <h2 id="circuitName">Sakhir</h2>
                        <span class="sub-label" id="circuitLocation">Bahrain</span>
                    </div>
                </div>
                
                <div class="circuit-visualizer">
                    <div class="nav-control-left" id="prevCircuit" role="button" tabindex="0" aria-label="Previous circuit">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </div>
                    
                    <div class="circuit-map" id="circuitImage">
                        <!-- SVG map -->
                    </div>

                    <div class="nav-control-right" id="nextCircuit" role="button" tabindex="0" aria-label="Next circuit">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </div>

                <div class="panel-sub-header">
                    <h3>WEATHER & TRACK TELEMETRY</h3>
                </div>
                <div class="weather-widget" id="weatherWidget">
                    <!-- Telemetry values -->
                </div>
            </main>

            <!-- Right Panel: Leaderboard Classification -->
            <aside class="panel leaderboard-panel">
                <div class="panel-header flex-header">
                    <h2>TIMING BOARD</h2>
                    <!-- Segmented tabs for session selection -->
                    <div class="session-tabs" id="sessionTabs">
                        <button class="session-tab active" data-filter="Race">RACE</button>
                        <button class="session-tab" data-filter="Qualifying">QUALY</button>
                        <button class="session-tab" data-filter="Practice">PRACTICE</button>
                    </div>
                </div>
                <div class="leaderboard-list" id="classificationList" aria-live="polite" aria-label="Driver classification">
                    <!-- Dynamic rows -->
                </div>
            </aside>
        </div>
    </div>

    <!-- Race Simulation — Full Screen -->
    <div class="sim-fs" id="simulationOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="simTitle">

        <!-- TOP BAR -->
        <header class="sim-topbar">
            <div class="sim-topbar-left">
                <span class="sim-tb-round" id="simRound">R01</span>
                <h2 class="sim-tb-title" id="simTitle">Bahrain Grand Prix</h2>
                <span class="sim-tb-sub">RACE SIMULATION</span>
            </div>
            <div class="sim-topbar-center">
                <div class="sim-hud-strip">
                    <div class="sim-hud-cell">
                        <span class="sim-hud-label">TIME</span>
                        <span class="sim-hud-value" id="simTime">15:00:00</span>
                    </div>
                    <div class="sim-hud-sep"></div>
                    <div class="sim-hud-cell">
                        <span class="sim-hud-label">LAP</span>
                        <span class="sim-hud-value" id="simLap">— / —</span>
                    </div>
                    <div class="sim-hud-sep"></div>
                    <div class="sim-hud-cell">
                        <span class="sim-hud-label">LEADER</span>
                        <span class="sim-hud-value sim-hud-leader" id="simLeader">—</span>
                    </div>
                </div>
            </div>
            <div class="sim-topbar-right">
                <button class="sim-close-btn" id="simCloseBtn" type="button" aria-label="Close simulation">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- MAIN BODY -->
        <div class="sim-body">

            <!-- LEFT: Control panel -->
            <aside class="sim-left">

                <!-- Mode picker -->
                <div class="sim-mode-section">
                    <p class="sim-section-label">START FROM</p>
                    <button class="sim-mode-btn" id="simModeFormation" type="button">
                        <span class="sim-mode-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                            </svg>
                        </span>
                        <span class="sim-mode-text">
                            <span class="sim-mode-title">FORMATION LAP</span>
                            <span class="sim-mode-desc">Full session from pit exit</span>
                        </span>
                    </button>
                    <button class="sim-mode-btn sim-mode-active" id="simModeRaceStart" type="button">
                        <span class="sim-mode-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                        </span>
                        <span class="sim-mode-text">
                            <span class="sim-mode-title">RACE START</span>
                            <span class="sim-mode-desc">Jump to lights out</span>
                        </span>
                    </button>
                </div>

                <!-- Divider -->
                <div class="sim-left-divider"></div>

                <!-- Playback controls -->
                <div class="sim-playback">
                    <p class="sim-section-label">PLAYBACK</p>
                    <div class="sim-play-row">
                        <button class="sim-ctrl-btn" id="simPlayBtn" type="button" aria-label="Play">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </button>
                        <button class="sim-ctrl-btn" id="simPauseBtn" type="button" aria-label="Pause">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        </button>
                    </div>
                    <div class="sim-speed-row">
                        <span class="sim-section-label">SPEED</span>
                        <div class="speed-options" id="simSpeedOptions">
                            <button class="speed-btn active" data-speed="1" type="button">1×</button>
                            <button class="speed-btn" data-speed="2" type="button">2×</button>
                            <button class="speed-btn" data-speed="5" type="button">5×</button>
                            <button class="speed-btn" data-speed="10" type="button">10×</button>
                        </div>
                    </div>
                    <div class="sim-progress-wrap">
                        <div class="progress-track">
                            <div class="progress-fill" id="simProgressFill"></div>
                        </div>
                        <span class="sim-prog-pct" id="simProgressTime">0%</span>
                    </div>
                </div>
            </aside>

            <!-- CENTER: Track canvas -->
            <main class="sim-track-area" aria-label="Circuit simulation">
                <div class="simulation-track-visual" id="simTrackVisual">
                    <canvas id="simTrackCanvas"></canvas>
                    <div class="simulation-dots" id="simDots"></div>
                </div>
            </main>

            <!-- RIGHT: F1 Timing Tower -->
            <aside class="sim-tower" aria-label="Live timing tower">
                <div class="tower-header">
                    <span class="tower-col-pos">P</span>
                    <span class="tower-col-driver">DRIVER</span>
                    <span class="tower-col-gap">GAP</span>
                    <span class="tower-col-chg"></span>
                </div>
                <div class="tower-list" id="simLeaderboardList"></div>
            </aside>

        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
